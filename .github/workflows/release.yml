name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

# One release at a time, so two merges cannot claim the same version number.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      number: ${{ steps.version.outputs.number }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Next version
        id: version
        run: |
          last=$(git tag --list 'v[0-9]*' | sed 's/^v//' | grep -E '^[0-9]+$' | sort -n | tail -1)
          next=$(( ${last:-0} + 1 ))
          echo "number=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # `ecsproxy --version` reports the release number.
      - name: Set version
        run: sed -i "0,/^version = .*/s//version = \"${{ needs.version.outputs.number }}.0.0\"/" Cargo.toml

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          name=ecsproxy-${{ needs.version.outputs.tag }}-linux-${{ matrix.arch }}
          tar -C target/release -czf "$name.tar.gz" ecsproxy
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ecsproxy-${{ matrix.arch }}
          path: ecsproxy-*.tar.gz*

  release:
    needs: [version, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.version.outputs.tag }}" ecsproxy-*.tar.gz ecsproxy-*.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "${{ needs.version.outputs.tag }}" --generate-notes
