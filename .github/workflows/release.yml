name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

# One release at a time, so two merges cannot claim the same version number.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Next version
        id: version
        run: |
          last=$(git tag --list 'v[0-9]*' | sed 's/^v//' | grep -E '^[0-9]+$' | sort -n | tail -1)
          next=$(( ${last:-0} + 1 ))
          echo "number=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"
          # `ecsproxy --version` reports the release number.
          sed -i "0,/^version = .*/s//version = \"$next.0.0\"/" Cargo.toml

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          name=ecsproxy-${{ steps.version.outputs.tag }}-linux-arm64
          tar -C target/release -czf "$name.tar.gz" ecsproxy
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" ecsproxy-*.tar.gz ecsproxy-*.sha256 \
            --target "$GITHUB_SHA" --title "${{ steps.version.outputs.tag }}" --generate-notes
